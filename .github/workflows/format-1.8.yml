name: Format Ponc 1.8
on:
  push:
    branches: [feature/precision-academy-1.8]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/precision-academy-1.8
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html e2e src tests README.md CHANGELOG-1.8.md package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "style: format Ponc 1.8"
            git push origin HEAD:feature/precision-academy-1.8
          fi
