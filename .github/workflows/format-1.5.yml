name: Format Ponc 1.5
on:
  push:
    branches: [feature/powerup-arena-1.5]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/powerup-arena-1.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html e2e src tests package.json package-lock.json README.md CHANGELOG-1.5.md
          if ! git diff --cached --quiet; then
            git commit -m "style: format Ponc 1.5"
            git push origin HEAD:feature/powerup-arena-1.5
          fi
