name: E2E diagnostic

on:
  push:
    branches: [feature/1.1.0-stable-core]

permissions:
  contents: write

jobs:
  report:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/1.1.0-stable-core
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Capture Playwright output
        run: env -u CI npx playwright test --reporter=line --retries=0 > e2e-report.txt 2>&1 || true
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e-report.txt
          git commit -m "chore: capture e2e diagnostics"
          git push
