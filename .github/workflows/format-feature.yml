name: Format Arcade Arena branch

on:
  push:
    branches: [feature/interactive-game-1.2]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/interactive-game-1.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format
      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html e2e src tests package.json package-lock.json README-1.2.md
          if ! git diff --cached --quiet; then
            git commit -m "style: apply Prettier to Arcade Arena"
            git push origin HEAD:feature/interactive-game-1.2
          fi
