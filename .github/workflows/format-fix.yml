name: Format source files

on:
  push:
    branches: [feature/1.1.0-stable-core]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/1.1.0-stable-core
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format source, tests and documentation
        run: npx prettier --write "src/**/*.{js,css}" "tests/**/*.js" "e2e/**/*.js" "*.js" "*.json" "*.md" "index.html"
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests e2e '*.js' '*.json' '*.md' index.html
          git diff --cached --quiet || git commit -m "style: apply Prettier formatting"
          git push
