name: Format diagnostic

on:
  push:
    branches: [feature/1.1.0-stable-core]

permissions:
  contents: write

jobs:
  report:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/1.1.0-stable-core
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Capture Prettier report
        run: npx prettier --list-different . > format-report.txt || true
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add format-report.txt
          git commit -m "chore: capture format diagnostics"
          git push
