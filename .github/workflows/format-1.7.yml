name: Format Ponc 1.7
on:
  push:
    branches: [feature/championship-circuit-1.7]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/championship-circuit-1.7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html e2e src tests README.md CHANGELOG-1.7.md package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "style: format Ponc 1.7"
            git push origin HEAD:feature/championship-circuit-1.7
          fi
