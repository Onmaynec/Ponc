name: Format Ponc 1.4
on:
  push:
    branches: [feature/game-modes-1.4]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/game-modes-1.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html e2e src tests package.json package-lock.json CHANGELOG-1.4.md
          if ! git diff --cached --quiet; then
            git commit -m "style: format Ponc 1.4 changes"
            git push origin HEAD:feature/game-modes-1.4
          fi
