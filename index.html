<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pong Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🎮 Pong Game</h1>
        <div class="scoreboard">
            <div class="score-item">
                <span class="score-label">Игрок</span>
                <span class="score-value" id="playerScore">0</span>
            </div>
            <div class="vs">VS</div>
            <div class="score-item">
                <span class="score-label">Компьютер</span>
                <span class="score-value" id="computerScore">0</span>
            </div>
        </div>
        <canvas id="gameCanvas"></canvas>
        <div class="controls">
            <p>⬆️ Вверх | ⬇️ Вниз | или Мышь</p>
            <button id="resetBtn">Начать заново</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
