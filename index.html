<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ponc - Pong Game</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎮 Ponc</h1>
            <p class="subtitle">Классическая игра Pong</p>
        </div>

        <div class="game-wrapper">
            <canvas id="gameCanvas" width="800" height="400"></canvas>
        </div>

        <div class="scoreboard">
            <div class="score-player">
                <span class="score-label">Вы</span>
                <span class="score-value" id="playerScore">0</span>
            </div>
            <div class="vs">VS</div>
            <div class="score-ai">
                <span class="score-label">Компьютер</span>
                <span class="score-value" id="aiScore">0</span>
            </div>
        </div>

        <div class="controls">
            <div class="control-item">
                <span class="control-label">🖱️ Мышь</span>
                <span class="control-desc">Движение ракетки</span>
            </div>
            <div class="control-item">
                <span class="control-label">⬆️ ⬇️ Стрелки</span>
                <span class="control-desc">Управление ракеткой</span>
            </div>
            <div class="control-item">
                <span class="control-label">R</span>
                <span class="control-desc">Новая игра</span>
            </div>
        </div>

        <div class="info">
            <p>Управляйте левой ракеткой и не дайте мячу пройти!</p>
            <p class="tip">💡 Совет: Компьютер очень сильный, попробуйте угадать его движение</p>
        </div>
    </div>

    <script src="js/game.js"></script>
</body>
</html>
